# -----------------------------------------------------------------------------------
# POC Zero-Downtime: SQL Server -> CDC (Debezium/Redpanda) -> PostgreSQL + Middleware
# -----------------------------------------------------------------------------------

services:
  # ---------------------------- BASES DE DATOS ------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "4096"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - ./sqlserver-init:/docker-entrypoint-initdb.d:ro
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.8
    container_name: postgres
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: "${PG_DB}"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./ddl:/ddl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ------------------------------ KAFKA STACK -------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092"
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  connect:
    build:
      context: ./connect
      dockerfile: Dockerfile        # tu Dockerfile multi-stage con curl
    #image: my-connect:7.6-debezium-2.6
    image: my-connect:7.6.0-custom
    container_name: connect
    depends_on:
      - redpanda
    environment:
      # *** Confluent requiere el prefijo CONNECT_ ***
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status

      # Converters del worker (podés dejarlos en JSON y setear Avro por conector si querés)
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # Plugins (incluye lo que descomprimiste en /usr/share/java)
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

      # Providers de variables de entorno (si querés ${env:...} en configs)
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ".*"


      # 🔧 Fuerza single-node correcto
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"



      # Secrets que luego inyectás desde Make/Curl (opcionales)
      SQLSERVER_PASSWORD: ${SA_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}

      # JVM / JMX (solo si usás exporter)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
      KAFKA_OPTS: "-javaagent:/jmx/jmx_prometheus_javaagent-1.5.0.jar=9404:/jmx/config.yml"
      JMX_PORT: "5555"

    ports:
      - "8083:8083"
      - "9404:9404"
    volumes:
      - ./connect-config:/connect-config:ro
      - ./connect-jmx:/jmx:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8083 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped



  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - redpanda
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    ports:
      - "8080:8080"

  # ----------------------------- FEATURE FLAGS ------------------------------------
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgres://postgres:${PG_PASSWORD}@postgres:5432/${PG_DB}"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-api-token"
    ports:
      - "4242:4242"

  # ------------------------------- MIDDLEWARE -------------------------------------
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: middleware
    depends_on:
      - sqlserver
      - postgres
      - unleash
      - connect
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      PG_USER: "${PG_USER}"
      PG_PASSWORD: "${PG_PASSWORD}"
      PG_DB: "${PG_DB}"
      UNLEASH_URL: "http://unleash:4242/api"
      UNLEASH_TOKEN: "${UNLEASH_TOKEN}"
    ports:
      - "3000:3000"

  # ------------------------------ OBSERVABILIDAD ----------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - middleware
      - redpanda
      - connect
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: poc-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - middleware
      - redpanda
      - connect
      - schema-registry
      - ksqldb-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default   # misma red de tus servicios (la default del compose)

  # ----------------------------- SCHEMA REGISTRY ----------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - redpanda
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://redpanda:9092
      SCHEMA_REGISTRY_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_OPTS: "-javaagent:/jmx/jmx_prometheus_javaagent-1.5.0.jar=9405:/jmx/schema-registry.yml"
    ports:
      - "8081:8081"
      - "9405:9405"
    volumes:
      - ./connect-jmx:/jmx:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/subjects >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ----------------------------- ksqlDB -------------------------------------------
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb-server
    depends_on:
      - redpanda
      - schema-registry
    environment:
      KSQL_BOOTSTRAP_SERVERS: redpanda:9092
      KSQL_KSQL_SERVICE_ID: "ksql_poc_01"
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_SINK_REPLICAS: "1"
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: "1"
      KSQL_KSQL_STREAMS_NUM_STREAM_THREADS: "1"
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: "1"
      KSQL_OPTS: "-javaagent:/jmx/jmx_prometheus_javaagent-1.5.0.jar=9406:/jmx/ksqldb.yml"
    ports:
      - "8088:8088"
      - "9406:9406"
    volumes:
      - ./connect-jmx:/jmx:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  tools:
    build:
      context: .
      dockerfile: tools/Dockerfile
    container_name: poc-tools
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      - schema-registry
      - ksqldb-server
# -----------------------------------------------------------------------------------
# Notas:
# - Requiere .env con SA_PASSWORD, PG_USER, PG_PASSWORD, PG_DB, UNLEASH_TOKEN
# -----------------------------------------------------------------------------------

volumes:
  sqlserver_data: {}
