global:
  scrape_interval: 15s
  scrape_configs:
  - job_name: 'middleware'
    static_configs: [{ targets: ['middleware:3000'] }]
  - job_name: 'connect'
    metrics_path: /metrics
    static_configs: [{ targets: ['connect:8083'] }]
  - job_name: 'redpanda'
    metrics_path: /metrics
    static_configs: [{ targets: ['redpanda:9644'] }]
  