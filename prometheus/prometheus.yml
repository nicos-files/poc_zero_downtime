global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'middleware'
    metrics_path: /metrics
    static_configs:
      - targets: ['middleware:3000']

  - job_name: 'connect'
    metrics_path: /metrics
    static_configs:
      - targets: ['connect:9404']
    relabel_configs:
      - target_label: app
        replacement: 'kafka_connect'

  - job_name: 'redpanda'
    metrics_path: /metrics
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'schema_registry'
    metrics_path: /metrics
    static_configs:
      - targets: ['schema-registry:9405']

  - job_name: 'ksqldb'
    metrics_path: /metrics
    static_configs:
      - targets: ['ksqldb-server:9406']
