        last_name:   { from: User_LastName, type: string }
        email:       { from: User_Email,    type: string, format: email }
        created_dt:  { from: Created_DT,    type: string, format: date-time }
        is_deleted:  { from: isDeleted,     type: boolean }
        is_onhold:   { from: isOnHold,      type: boolean }
      allow_delete: false
