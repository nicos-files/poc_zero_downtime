        update_id:        { from: Update_ID,      type: int32 }
        specific_id:      { from: Specific_ID,    type: int32 }
        lineitem_number:  { from: LineItem_Number, type: int32 }
        kit_name:         { from: Kit_Name,       type: string }
        kit_action:       { from: Kit_Action,     type: string }
        is_newpartaction: { from: isNewPartAction, type: boolean }
        is_oldpartaction: { from: isOldPartAction, type: boolean }
        struct_on:        { from: StructOn,       type: string, format: date-time }
        struct_off:       { from: StructOff,      type: string, format: date-time }
        qty:              { from: Qty,            type: double }
        ebom_id:          { from: EBOM_ID,        type: int32 }
      allow_delete: false

  ebom_062104:
