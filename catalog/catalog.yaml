      fields:
        id:             { from: Approver_ID,   type: int32 }
        user_id:        { from: User_ID,       type: int32 }
        approval_code:  { from: Approval_Code, type: string }
        routing_id:     { from: Routing_ID,    type: int32 }
      allow_delete: false

  updt_join_updates_routings:
    source:
      topic: mssql.appdb.dbo.UPDT_JOIN_UpdatesRoutings
      key: [UpdateRouting_ID]
      fields:
        - UpdateRouting_ID
        - Update_ID
        - Routing_ID
        - Routing_Order
    projection:
      topic: updt_join_updates_routings_public_v2
      table: public.updt_join_updates_routings
      key: [id]
      fields:
        id:             { from: UpdateRouting_ID, type: int32 }
        update_id:      { from: Update_ID,        type: int32 }
        routing_id:     { from: Routing_ID,       type: int32 }
        routing_order:  { from: Routing_Order,    type: int32 }
      allow_delete: false

  updt_return_to_author:
    source:
      topic: mssql.appdb.dbo.UPDT_ReturnToAuthor
      key: [Return_ID]
      fields:
        - Return_ID
        - Update_ID
        - Return_DT
        - Return_Text
        - Return_UserID
        - Log_ID
    projection:
      topic: updt_return_to_author_public_v2
      table: public.updt_return_to_author
      key: [id]
      fields:
        id:            { from: Return_ID,     type: int32 }
        update_id:     { from: Update_ID,     type: int32 }
        return_dt:     { from: Return_DT,     type: string, format: date-time }
        return_text:   { from: Return_Text,   type: string }
        return_user_id: { from: Return_UserID, type: int32 }
        log_id:        { from: Log_ID,        type: int32 }
      allow_delete: false
  bom_master:
    source:
      topic: mssql.appdb.dbo.BOM_Master
      key: [BOM_ID]
      fields:
        - BOM_ID
        - User_ID
        - Update_ID
        - LineItem_Number
        - Create_DT
        - Modify_DT
    projection:
      topic: bom_master_public_v2
      table: public.bom_master
      key: [id]
      fields:
        id:              { from: BOM_ID,          type: int32 }
        user_id:         { from: User_ID,         type: int32 }
        update_id:       { from: Update_ID,       type: int32 }
        lineitem_number: { from: LineItem_Number, type: int32 }
        create_dt:       { from: Create_DT,       type: string, format: date-time }
        modify_dt:       { from: Modify_DT,       type: string, format: date-time }
      allow_delete: false

  bom_operationtypes:
    source:
      topic: mssql.appdb.dbo.BOM_OperationTypes
      key: [OpType_ID]
      fields:
        - OpType_ID
        - OpType_Name
    projection:
      topic: bom_operationtypes_public_v2
      table: public.bom_operationtypes
      key: [id]
      fields:
        id:   { from: OpType_ID,   type: int32 }
        name: { from: OpType_Name, type: string }
      allow_delete: false

  bom_operations:
    source:
      topic: mssql.appdb.dbo.BOM_Operations
      key: [Op_ID]
      fields:
        - Op_ID
        - OpType_ID
        - OpType_Name
        - BOM_ID
        - WorkCenter
        - SetUpTime
        - LeadTime
        - QtyPer
        - UOM
        - Route
    projection:
      topic: bom_operations_public_v2
      table: public.bom_operations
      key: [id]
      fields:
        id:          { from: Op_ID,        type: int32 }
        bom_id:      { from: BOM_ID,      type: int32 }
        optype_id:   { from: OpType_ID,   type: int32 }
        optype_name: { from: OpType_Name, type: string }
        workcenter:  { from: WorkCenter,  type: string }
        setup_time:  { from: SetUpTime,   type: double }
        lead_time:   { from: LeadTime,    type: double }
        qty_per:     { from: QtyPer,      type: double }
        uom:         { from: UOM,         type: string }
        route:       { from: Route,       type: int32 }
      allow_delete: false

  bom_childpartnumbers:
    source:
      topic: mssql.appdb.dbo.BOM_ChildPartNumbers
      key: [CP_ID]
      fields:
        - CP_ID
        - BOM_ID
        - ChildPartNumber
