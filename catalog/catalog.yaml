        id:               { from: CP_ID,           type: int32 }
        bom_id:           { from: BOM_ID,          type: int32 }
        child_partnumber: { from: ChildPartNumber, type: string }
        qty:              { from: Qty,             type: double }
        order_by:         { from: OrderBy,         type: int32 }
        route:            { from: Route,           type: int32 }
      allow_delete: false

  data_kits:
    source:
      topic: mssql.appdb.dbo.DATA_Kits
      key: [Kit_ID]
