      topic: mssql.appdb.dbo.LOG_EBOMHistory
      key: [Log_ID]
      fields:
        - Log_ID
        - EBOM_ID
        - Update_ID
        - Specific_ID
        - LineItem_Number
        - Engine_Spec
        - Current_Part_Number
        - DESCRIPTION
        - Qty
        - New_Qty_w_Action
        - Old_Part_No
        - Kit_Name
        - Log_DT
    projection:
      topic: log_ebomhistory_public_v2
      table: public.log_ebomhistory
      key: [id]
      fields:
        id:              { from: Log_ID,             type: int32 }
        ebom_id:         { from: EBOM_ID,            type: int32 }
        update_id:       { from: Update_ID,          type: int32 }
        specific_id:     { from: Specific_ID,        type: int32 }
        lineitem_number: { from: LineItem_Number,    type: int32 }
        engine_spec:     { from: Engine_Spec,        type: string }
        current_part:    { from: Current_Part_Number,type: string }
        description:     { from: DESCRIPTION,        type: string }
        qty:             { from: Qty,                type: string }
        new_qty_action:  { from: New_Qty_w_Action,   type: string }
