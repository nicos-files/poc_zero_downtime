        kit_desc:     { from: Kit_Desc,    type: string }
        is_deleted:   { from: isDeleted,   type: boolean }
        phase_number: { from: Phase_Number,type: string }
        is_bom:       { from: isBom,       type: boolean }
      allow_delete: false


  updt_join_updatespageitems:
    source:
      topic: mssql.appdb.dbo.UPDT_JOIN_UpdatesPageItems
