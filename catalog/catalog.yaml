entities:
  customers:
    source:
      topic: mssql.appdb.dbo.customers
      key: [id]
      # Campos que Debezium expone post-unwrap (superset)
      fields:
        - id
        - name
        - email
        - status        # <-- extra en origen (no lo mandaremos al destino)
        - notes         # <-- extra en origen
        - created_at    # (nanotimestamp SQL Server)
        - __deleted     # tombstone lógico post-unwrap
    projection:
      topic: customers_public_v2
      table: public.customers
      key: [id]
      fields:
        id:         { from: id,          type: int32 }
        full_name:  { from: name,        type: string }
        email:      { from: email,       type: string, format: email }
        created_at: { from: created_at,  type: string, format: date-time }
      allow_delete: true

  orders:
    source:
      topic: mssql.appdb.dbo.orders
      key: [id]
      fields:
        - id
        - customer_id
        - total_amount
        - status        # <-- extra
        - currency      # <-- extra
        - created_at
        - updated_at
        - __deleted
    projection:
      topic: orders_public_v2
      table: public.orders
      key: [id]
      fields:
        id:           { from: id,           type: int32 }
        customer_id:  { from: customer_id,  type: int32 }
        total_amount: { from: total_amount, type: double }
        created_at:   { from: created_at,   type: string, format: date-time }
      allow_delete: true


  heartbeat:
    source:
      topic: mssql.appdb.dbo.heartbeat
      key: [id]
      fields:
        - id
        - ts_utc
        - __deleted
    projection:
      topic: heartbeat_public_v2
      table: public.heartbeat
      key: [id]
      fields:
        id:     { from: id,     type: int32 }
        ts_utc: { from: ts_utc, type: string, format: date-time }
      allow_delete: false
  

  updt_basics:
    source:
      topic: mssql.appdb.dbo.UPDT_Basics
      key: [Update_ID]
      fields:
        - Update_ID
        - Update_Number
        - Title
        - Engine_Phase
        - User_ID
        - SpecChange_ID
        - CreateDate
        - Released
        - isSubmitted
        - isReturned
        - isCopy
        - isERPAdmin
        - isSysproInProcess
        - isSysproComplete
    projection:
      topic: updt_basics_public_v2
      table: public.updt_basics
      key: [id]
      fields:
        id:                  { from: Update_ID,         type: int32 }
        update_number:       { from: Update_Number,     type: int32 }
        title:               { from: Title,             type: string }
        engine_phase:        { from: Engine_Phase,      type: string }
        user_id:             { from: User_ID,           type: int32 }
        spec_change_id:      { from: SpecChange_ID,     type: int32 }
        create_date:         { from: CreateDate,        type: string, format: date-time }
        released:            { from: Released,          type: boolean }
        is_submitted:        { from: isSubmitted,       type: boolean }
        is_returned:         { from: isReturned,        type: boolean }
        is_copy:             { from: isCopy,            type: boolean }
        is_erp_admin:        { from: isERPAdmin,        type: boolean }
        is_syspro_in_process: { from: isSysproInProcess, type: boolean }
        is_syspro_complete:  { from: isSysproComplete,  type: boolean }
      allow_delete: false

  
  update_specifics1:
    source:
      topic: mssql.appdb.dbo.UPDateSpecifics1
      key: [Specific_ID]
      fields:
        - Specific_ID
        - Update_ID
        - Update_Number
        - New_Part_Number
        - Old_Part_Number
        - Status
        - Due_Date
        - Vendor
        - Vendor_Part_Number
        - ItemNumber
        - NewCost
        - ObsoleteCost
        - isEBOM
        - isEnteredERP
        - isMileageTracked
    projection:
      topic: update_specifics1_public_v2
      table: public.update_specifics1
      key: [id]
      fields:
        id:                    { from: Specific_ID,       type: int32 }
        update_id:             { from: Update_ID,         type: int32 }
        update_number:         { from: Update_Number,     type: int32 }
        new_part_number:       { from: New_Part_Number,   type: string }
        old_part_number:       { from: Old_Part_Number,   type: string }
        status:                { from: Status,            type: string }
        due_date:              { from: Due_Date,          type: string, format: date-time }
        vendor:                { from: Vendor,            type: string }
        vendor_part_number:    { from: Vendor_Part_Number,type: string }
        item_number:           { from: ItemNumber,        type: int32 }
        new_cost:              { from: NewCost,           type: double }
        obsolete_cost:         { from: ObsoleteCost,      type: double }
        is_ebom:               { from: isEBOM,            type: boolean }
        is_entered_erp:        { from: isEnteredERP,      type: boolean }
        is_mileage_tracked:    { from: isMileageTracked,  type: boolean }
      allow_delete: false


  user_update_approvers:
    source:
      topic: mssql.appdb.dbo.USER_UpdateApprovers
      key: [Approver_ID]
      fields:
        - Approver_ID
        - User_ID
        - Approval_Code
        - Routing_ID
    projection:
      topic: user_update_approvers_public_v2
