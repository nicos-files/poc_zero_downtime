        specific_id:       { from: Specific_ID,        type: int32 }
        lineitem_number:   { from: LineItem_Number,    type: int32 }
        engine_spec:       { from: Engine_Spec,        type: string }
        current_part:      { from: Current_Part_Number,type: string }
        description:       { from: DESCRIPTION,        type: string }
        qty:               { from: Qty,                type: string }
