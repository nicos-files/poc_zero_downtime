receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'middleware'
          metrics_path: /metrics
          static_configs:
            - targets: ['middleware:3000']

        - job_name: 'connect'
          metrics_path: /metrics
          static_configs:
            - targets: ['connect:9404']

        - job_name: 'redpanda'
          metrics_path: /metrics
          static_configs:
            - targets: ['redpanda:9644']

        - job_name: 'schema_registry'
          metrics_path: /metrics
          static_configs:
            - targets: ['schema-registry:9405']

        - job_name: 'ksqldb'
          metrics_path: /metrics
          static_configs:
            - targets: ['ksqldb-server:9406']

exporters:
  otlp:
    endpoint: host.docker.internal:4317
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
